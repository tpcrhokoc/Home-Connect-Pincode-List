<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Connect Pincode List</title>
  <!-- Load Tailwind CSS & PapaParse CSV Parser -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-6">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Home Connect Pincode List</h1>
        <p class="text-sm text-slate-500" id="statusText">Loading live pincode data...</p>
      </div>
      <!-- Search Input -->
      <div class="w-full md:w-72">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search pincode or area..." 
          class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
          oninput="filterData()"
        >
      </div>
    </header>

    <!-- Table Container -->
    <div class="bg-white rounded-xl shadow border border-slate-200 overflow-x-auto">
      <table class="w-full text-left border-collapse" id="dataTable">
        <thead id="tableHead" class="bg-slate-100 border-b border-slate-200 text-slate-700 font-semibold text-sm"></thead>
        <tbody id="tableBody" class="divide-y divide-slate-100 text-sm">
          <tr>
            <td class="p-4 text-center text-slate-500">Loading data, please wait...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Exact Google Sheets Published CSV Link wrapped in quotes:
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRuUswpxElfne9KN5y2oKQ2ae49CgbIEQ4O8sM6P5Cji-HCtaqXRznBt_kK_XTS2_6VQEAcYQA-NxtV/pub?output=csv';
    
    let originalData = [];
    let headers = [];

    // Fetch and parse live data from Google Sheets
    Papa.parse(csvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        if (results.data && results.data.length > 0) {
          headers = Object.keys(results.data[0]);
          originalData = results.data;
          document.getElementById('statusText').innerText = `Total Records Loaded: ${originalData.length}`;
          renderTable(originalData);
        } else {
          document.getElementById('statusText').innerText = 'No records found in spreadsheet.';
          document.getElementById('tableBody').innerHTML = '<tr><td class="p-4 text-center text-slate-400">The published sheet is empty.</td></tr>';
        }
      },
      error: function(err) {
        console.error('Error loading CSV:', err);
        document.getElementById('statusText').innerText = 'Error loading spreadsheet data.';
        document.getElementById('tableBody').innerHTML = '<tr><td class="p-4 text-center text-red-500">Failed to fetch data. Verify that "Publish to Web" is active in Google Sheets.</td></tr>';
      }
    });

    // Function to draw the table dynamically
    function renderTable(data) {
      const headEl = document.getElementById('tableHead');
      const bodyEl = document.getElementById('tableBody');

      // Render Header Row
      headEl.innerHTML = `<tr>${headers.map(h => `<th class="p-3 border-b">${h}</th>`).join('')}</tr>`;

      // Render Data Rows
      if (data.length === 0) {
        bodyEl.innerHTML = `<tr><td colspan="${headers.length}" class="p-4 text-center text-slate-400">No matching pincodes found.</td></tr>`;
        return;
      }

      bodyEl.innerHTML = data.map(row => {
        return `<tr>${headers.map(h => `<td class="p-3">${row[h] || ''}</td>`).join('')}</tr>`;
      }).join('');
    }

    // Dynamic Filter Function
    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = originalData.filter(row => {
        return headers.some(header => {
          return String(row[header]).toLowerCase().includes(query);
        });
      });
      renderTable(filtered);
    }
  </script>
</body>
</html>
